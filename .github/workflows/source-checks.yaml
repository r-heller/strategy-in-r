name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install PDF fixture reader
        run: python -m pip install pypdf==6.21.4
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          dependencies: 'c("Depends", "Imports", "LinkingTo")'
          install-pandoc: 'false'
          install-quarto: 'false'
          packages: |
            any::tidyverse
            any::here
            any::glue
            any::gt
            any::scales
            any::knitr
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Check source provenance and download fixtures
        run: python -m unittest discover -s tests
      - name: Check navigation, references and EPUB fixtures
        run: |
          node --test tests/*.test.cjs
          python scripts/check-source-refs.py
          python tests/test-epub.py
      - name: Execute the teaching MCTS and fresh-process setup contracts
        run: |
          Rscript --vanilla tests/test-mcts.R
          Rscript --vanilla tests/test_setup_cache.R
